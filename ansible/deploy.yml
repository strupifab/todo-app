
# Déployer l'app Todo : Docker installé, conteneur lancé, santé vérifiée
- name: Déployer l'app Todo
  # all : les serveurs de l'inventaire reçu (staging OU production)
  hosts: all
  become: true
  vars:
    # Valeurs par défaut, remplacées par le pipeline (--extra-vars)
    image_repo: ghcr.io/strupifab/todo-app
    image_tag: latest
    admin_token: "{{ lookup('env', 'ADMIN_TOKEN') }}"
  tasks:
    - name: Installer Docker et le module Python pour Docker
      ansible.builtin.apt:
        name: [docker.io, python3-docker]
        state: present
        update_cache: true

    - name: Démarrer Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Lancer le conteneur Todo
      community.docker.docker_container:
        name: todo
        image: "{{ image_repo }}:{{ image_tag }}"
        pull: always
        ports: ["80:5000","8000:8000"]
        restart_policy: always
        env:
          ADMIN_TOKEN: "{{ admin_token }}"
      no_log: true #   ne jamais afficher le jeton dans les logs

    - name: Vérifier que l'application répond
      ansible.builtin.uri:
        url: http://localhost/health
      register: sante
      retries: 5
      delay: 3
      until: sante.status == 200

    - name: Execution docker ps
      ansible.builtin.command: docker ps
      register: conteneurs

    - name: Debug Execution docker ps
      ansible.builtin.debug:
        var: conteneurs.stdout_lines

