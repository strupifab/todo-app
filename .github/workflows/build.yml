name: Build
 
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Moindre privilège : lecture seule par défaut pour tous les jobs
permissions:
  contents: read
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
 
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: pip
 
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
 
      - name: Vérifier le code (lint)
        run: |
          pip install flake8
          flake8 app/ tests/
 
      - name: Compiler
        run: python -m compileall app/
 
      - name: Écrire un résumé
        run: |
          echo "### Python : $(python --version)" >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
 
      - name: Echo de la variable $GITHUB_STEP_SUMMARY
        run: |
          echo "GITHUB_STEP_SUMMARY=$GITHUB_STEP_SUMMARY"

      - name: Sauvegarder l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: todo-app
          path: app/

      - name: Lister les paquets
        run: |
          echo ::group::Paquets installés
          pip list
          echo ::endgroup::

  docker:
    needs: test
    # On publie l'image seulement pour un push sur main, pas pour une PR
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
 
      - name: Calculer le nom de l'image (en minuscules)
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/todo-app" \
            >> "$GITHUB_ENV"
 
      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Construire et publier l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  test:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
 
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
 
      - name: Installer les dépendances
        run: pip install -r requirements.txt
 
      - name: Lancer les tests
        run: pytest -v --junitxml=rapport.xml
 
      - name: Rapport de tests
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Tests PyTest
          path: rapport.xml
          reporter: java-junit
 
      - name: Garder le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: rapport.xml

  deploy-staging:
    needs: docker
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Ansible
        run: pipx install --include-deps --force ansible

      - name: Calculer le dépôt de l'image (en minuscules)
        run: |
          echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/todo-app" \
            >> "$GITHUB_ENV"

      - name: Déployer avec Ansible
        uses: dawidd6/action-ansible-playbook@v9
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        with:
          playbook: deploy.yml
          directory: ./ansible
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          inventory: ${{ secrets.INVENTORY }}
          options: |
            --extra-vars image_repo=${{ env.IMAGE_REPO }}
            --extra-vars image_tag=${{ github.sha }}


  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Ansible
        run: pipx install --include-deps --force ansible

      - name: Calculer le dépôt de l'image (en minuscules)
        run: |
          echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/todo-app" \
            >> "$GITHUB_ENV"

      - name: Déployer avec Ansible
        uses: dawidd6/action-ansible-playbook@v9
        with:
          playbook: deploy.yml
          directory: ./ansible
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          inventory: ${{ secrets.INVENTORY }}
          options: |
            --extra-vars image_repo=${{ env.IMAGE_REPO }}
            --extra-vars image_tag=${{ github.sha }}


